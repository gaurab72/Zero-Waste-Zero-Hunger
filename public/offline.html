<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroWaste – Offline</title>
    <link rel="stylesheet" href="assets/css/admin.css" />
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            background: var(--admin-bg, #0a0a0a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-family: var(--font-primary, 'Inter', sans-serif);
        }

        .msg {
            max-width: 600px;
            text-align: center;
        }

        .msg h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .msg p {
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="msg">
        <h1>You're offline</h1>
        <p>It looks like you don't have an internet connection. The core features of ZeroWaste are still available
            offline.</p>
        <p>Try reconnecting to the internet to access the full dashboard.</p>
    </div>
</body>

</html>
