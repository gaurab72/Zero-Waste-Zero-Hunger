<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroWaste – Home</title>
    <!-- Re‑use the dark‑theme variables from admin.css -->
    <link rel="stylesheet" href="assets/css/admin.css" />
    <style>
        /* Full‑screen container with perspective for 3‑D effect */
        body,
        html {
            height: 100%;
            margin: 0;
            background: var(--admin-bg, #0a0a0a);
            overflow: hidden;
            font-family: var(--font-primary, 'Inter', sans-serif);
        }

        .scene {
            width: 100%;
            height: 100%;
            perspective: 1200px;
            /* depth for 3‑D */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cube {
            width: 250px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 12s infinite linear;
        }

        .cube div {
            position: absolute;
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(59, 130, 246, 0.8));
            border: 2px solid var(--admin-card-border);
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .cube .front {
            transform: rotateY(0deg) translateZ(125px);
        }

        .cube .back {
            transform: rotateY(180deg) translateZ(125px);
        }

        .cube .right {
            transform: rotateY(90deg) translateZ(125px);
        }

        .cube .left {
            transform: rotateY(-90deg) translateZ(125px);
        }

        .cube .top {
            transform: rotateX(90deg) translateZ(125px);
        }

        .cube .bottom {
            transform: rotateX(-90deg) translateZ(125px);
        }

        @keyframes rotate {
            from {
                transform: rotateX(0deg) rotateY(0deg);
            }

            to {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        .hero-text {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: var(--text-primary);
            font-size: 2.5rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .cta {
            margin-top: 1rem;
            display: inline-block;
            padding: 0.8rem 1.6rem;
            background: var(--primary);
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <div class="hero-text">
        <h1>ZeroWaste – Empowering Communities</h1>
